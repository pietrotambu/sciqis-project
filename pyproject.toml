[project]
name = "sciqis-project"
version = "0.1.0"
description = "Compare different quantum computing frameworks"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "qiskit>=1.2",
    "qiskit-aer>=0.15",
    "pennylane>=0.38",
    "pennylane-lightning>=0.38",
    "cirq-core>=1.4",
    "amazon-braket-sdk>=1.125",
    "qulacs>=0.6",
]

# Installed only on the HPC GPU nodes: uv sync --group gpu
# qiskit-aer-gpu (the CUDA-12 build) is abandoned upstream at 0.15.1, which
# predates qiskit 2.x's API and fails to import. qiskit-aer-gpu-cu11 tracks
# qiskit-aer's releases and works fine on A100s via driver forward-compat.
[dependency-groups]
gpu = [
    "qiskit-aer-gpu-cu11>=0.17",
    "pennylane-lightning-gpu>=0.38",
]
