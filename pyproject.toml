[project]
name = "sciqis-project"
version = "0.1.0"
description = "Compare different quantum computing frameworks"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "qiskit>=1.2",
    "qiskit-aer>=0.15",
    "pennylane>=0.38",
    "pennylane-lightning>=0.38",
    "cirq-core>=1.4",
    "amazon-braket-sdk>=1.125",
    "qulacs>=0.6",
]

[dependency-groups]
gpu = [
    "qiskit-aer-gpu-cu11>=0.17",
    "pennylane-lightning-gpu>=0.38",
]
